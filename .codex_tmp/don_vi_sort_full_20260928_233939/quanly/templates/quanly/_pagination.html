{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav aria-label="Phân trang" class="mt-3">
    <ul class="pagination justify-content-center mb-0">
        {% if page_obj.has_previous %}
            <li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if pagination_query %}&{{ pagination_query }}{% elif query %}&q={{ query|urlencode }}{% endif %}">Trước</a></li>
        {% endif %}
        <li class="page-item active"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
        {% if page_obj.has_next %}
            <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if pagination_query %}&{{ pagination_query }}{% elif query %}&q={{ query|urlencode }}{% endif %}">Sau</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
