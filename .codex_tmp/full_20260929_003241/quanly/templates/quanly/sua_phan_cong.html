{% extends 'quanly/base.html' %}
{% block title %}Sửa phân công trẻ{% endblock %}
{% block content %}<div class="container mt-4"><div class="card shadow"><div class="card-header"><h5>Sửa phân công #{{ item.pk }}</h5></div><div class="card-body"><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label fw-bold">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<a href="{% url 'danh_sach_phan_cong' %}" class="btn btn-secondary">Hủy</a> <button class="btn btn-primary">Lưu thay đổi</button></form></div></div></div>{% endblock %}
