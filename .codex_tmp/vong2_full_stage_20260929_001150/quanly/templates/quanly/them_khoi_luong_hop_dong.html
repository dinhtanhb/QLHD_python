{% extends 'quanly/base.html' %}
{% block title %}Thêm khối lượng hợp đồng{% endblock %}
{% block content %}<div class="container mt-4"><div class="card shadow"><div class="card-header"><h5>Thêm khối lượng - {{ hop_dong.so_hop_dong }}</h5></div><div class="card-body"><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<a href="{% url 'chi_tiet_hop_dong' hop_dong.pk %}" class="btn btn-secondary">Hủy</a> <button class="btn btn-primary">Lưu</button></form></div></div></div>{% endblock %}
