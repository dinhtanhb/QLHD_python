{% extends 'quanly/base.html' %}
{% block title %}Import Danh sách Trẻ{% endblock %}
{% block content %}
<div class="container-fluid bg-white shadow p-4 rounded" style="max-width: 600px;">
    <h3 class="text-primary mb-3">Import Danh sách Trẻ từ Excel</h3>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Chọn file Excel danh sách trẻ:</label>
            <input type="file" name="file_excel" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success">Tải lên và Xử lý</button>
        <a href="{% url 'danh_sach_tre' %}" class="btn btn-secondary">Quay lại danh sách</a>
    </form>
</div>
{% endblock %}
