{% extends 'quanly/base.html' %}
{% block title %}Điều chuyển phân công{% endblock %}
{% block content %}<div class="container mt-4"><div class="card shadow"><div class="card-header bg-warning"><h5 class="mb-0">Điều chuyển phân công #{{ item.pk }}</h5></div><div class="card-body"><p><strong>Trẻ:</strong> {{ item.tre.ho_ten }} — <strong>CBCT hiện tại:</strong> {{ item.phan_bo.can_bo.ho_ten }}</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-warning">Lưu điều chuyển</button> <a class="btn btn-outline-secondary" href="{% url 'danh_sach_phan_cong' %}">Hủy</a></form></div></div></div>{% endblock %}
